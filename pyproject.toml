[project]
name = "frameaxis"
version = "0.1.0"
description = "FrameAxis: characterizing microframe bias and intensity with word embedding"
authors = [{ name = "Kwak Haewoon", email = "haewoon@acm.org" }]
readme = "README.md"
# 3.10 reached end of life in October 2026; gensim 4.4.0 has no wheels past 3.13. CI tests 3.11 and 3.13.
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "gensim",
    "nltk",
]

[project.optional-dependencies]
# Notebooks in examples/ and scripts/make_reference.py
examples = [
    "pandas",
    "matplotlib",
    "notebook",
]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
